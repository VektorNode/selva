name: Test

on:
  pull_request:
  # Push catches what the PR trigger misses: direct pushes (routine on beta) and
  # Dependabot auto-merges. Without beta here, beta's first lint, fixture and
  # changeset check was the promotion PR. Cron catches toolchain drift.
  push:
    branches: [main, beta]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

# Read-only: this workflow only builds and tests, never writes to the repo.
permissions:
  contents: read

# Keyed on workflow too, so push-to-main and PR runs for one ref don't cancel
# each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Must precede `uses: ./...` below — GitHub resolves local actions from
      # the runner's filesystem.
      - uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      # Publish coverage, bundle-only selva, cli/selva fixed-group.
      - name: Check publish invariants
        run: node scripts/release/publishable-packages.mjs --check

      # Released Grasshopper components bind wires by parameter index — a
      # changed param list on an existing GUID silently rewires saved
      # definitions. Structural changes must go through the OBSOLETE +
      # upgrader procedure (STRUCTURE.md) with a new GUID.
      - name: Check component signatures
        run: node scripts/plugin/check-component-signatures.mjs --check

      # Test fixtures, examples and dev scenes: allowed folders, kebab-case
      # names, and the dev/ and examples/ inventories (STRUCTURE.md).
      - name: Check fixtures
        run: node scripts/develop/check-fixtures.mjs

      # Tests for the repo's own scripts, the signature check above among them. Offline.
      - name: Test repo scripts
        run: pnpm test:scripts

      # Mixed or misnamed changesets only fail in `changeset version`, i.e. in
      # the release job after the test gate has already passed.
      - name: Validate changeset contents
        run: node scripts/release/validate-changesets.mjs

      # Releases are changeset-driven: a publishable-package change without a
      # changeset never ships. `pnpm changeset --empty` is the opt-out.
      # The Version Packages PR is exempt by construction: it consumes every
      # changeset and bumps the versions they called for, so it always touches
      # publishable packages and never carries a changeset of its own.
      - name: Check changesets
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          node scripts/release/check-changesets.mjs --base FETCH_HEAD

      # beta takes direct pushes, so no PR ran the check above. Diff from where
      # beta forked off main, the delta the promotion PR checks, not from
      # `before`: concurrency cancels superseded runs, so a per-push diff never
      # checks the cancelled pushes, and sync-beta's push would list main's
      # released commits as beta's own.
      - name: Resolve beta's fork point
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: |
          git fetch --no-tags --unshallow origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/beta:refs/remotes/origin/beta
          echo "BETA_BASE=$(git merge-base origin/main HEAD)" >> "$GITHUB_ENV"

      - name: Check changesets (beta push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
        run: node scripts/release/check-changesets.mjs --base "$BETA_BASE"

      # Advisories are checked in audit.yml, not here: a new one would fail
      # every PR, whatever it changed.

      # ui-schema.json and wire-schema.json are the source of truth; the generated TS/C# is derived.
      # This is the CI backstop for both generator guarantees: stale committed
      # output, and (on PRs and beta pushes) a definitions change without a
      # schemaVersion bump. The bump guard compares against the PR base or
      # beta's fork point: in CI the working tree always matches HEAD, so its
      # default HEAD comparison can never fire.
      - name: Verify generated code is up to date
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}"
            export SCHEMA_GUARD_BASE_REF=FETCH_HEAD
          elif [ -n "$BETA_BASE" ]; then
            export SCHEMA_GUARD_BASE_REF="$BETA_BASE"
          fi
          if ! pnpm check:generated; then
            echo "::error::Generated code check failed (see above). Run 'pnpm generate' and commit the result."
            exit 1
          fi

      # lint, lint:types, check, type-check and test all run through turbo, which
      # keys each task on its own inputs, and all but lint depend on `^build` — so
      # a restored cache skips the ~75s build they would otherwise each trigger.
      #
      # Cache only .turbo/cache (the task outputs). The rest of .turbo is daemon
      # state and logs, which must not travel between runners.
      #
      # actions/cache never overwrites an existing key, so the key carries the
      # run id to stay unique; restore-keys does the actual work, taking the most
      # recent prefix match. Keyed on lockfile too: a dependency change
      # invalidates every task hash anyway, so old entries are dead weight.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-js-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            turbo-js-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-js-

      # `pnpm format:check` passes --cache-strategy content: the default keys on
      # mtime, which actions/checkout rewrites every run, so every entry would
      # miss. Keyed on the prettier config so a rule change busts it.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/prettier
          key: prettier-${{ hashFiles('prettier.config.js', '.prettierignore') }}-${{ github.run_id }}
          restore-keys: |
            prettier-${{ hashFiles('prettier.config.js', '.prettierignore') }}-
            prettier-

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm lint:types
      - run: pnpm type-check
      - run: pnpm check

      # Every package's test task. @selvajs/supabase-provider's live-stack
      # suites self-skip without Supabase creds (no .env.test in this job); the
      # `supabase` job below runs them.
      - run: pnpm exec turbo run test

      # actions/cache has no eviction: .turbo/cache would grow by every task
      # output every run until it crowds out the repo's 10GB budget. Keep the
      # most recent entries and drop the rest before the post-step uploads.
      - name: Prune turbo cache
        if: always()
        run: |
          cd .turbo/cache 2>/dev/null || exit 0
          ls -1t | tail -n +600 | xargs -r rm -f
          echo "turbo cache: $(du -sh . | cut -f1) across $(ls -1 | wc -l) files"

  # The provider's conformance and RLS suites against a real stack: the JS job
  # above skips them. SELVA_REQUIRE_SUPABASE turns a skip into a failure here.
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - name: Start Supabase
        working-directory: packages/providers/supabase
        run: pnpm exec supabase start -x studio,logflare,vector,imgproxy,edge-runtime,postgres-meta,mailpit

      - name: Write .env.test
        working-directory: packages/providers/supabase
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
          } > .env.test

      - name: Test against the stack
        env:
          SELVA_REQUIRE_SUPABASE: '1'
        run: pnpm exec turbo run test --filter=@selvajs/supabase-provider --env-mode=loose --force

  # Rhino-free .NET libraries; runs in parallel with the JS job.
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test

  # Rhino 9 on Windows is the primary platform, and the GDI+ raster tests and the
  # Windows Credential Manager round trip skip on Linux.
  dotnet-windows:
    runs-on: windows-latest
    env:
      # The runner, and the credential it writes, is thrown away after the job.
      SELVA_CREDENTIAL_STORE_TEST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/dotnet-test
