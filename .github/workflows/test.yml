name: Test

on:
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same PR.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Persist Turbo's local task cache (type-check/check/generate all run
      # through turbo). Turbo handles input hashing; the SHA key writes a fresh
      # entry each run and restore-keys warm-seed from the latest prior cache.
      # Scoped per workflow — actions/cache entries don't cross workflows.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: |
            turbo-test-

      # Workspace versioning invariants (publish coverage, bundle-only selva,
      # cli/selva fixed-group). Pure file scan — fails fast, no build needed.
      - name: Check publish invariants
        run: node scripts/publishable-packages.mjs --check

      # Fail on known vulnerabilities in production dependencies. `--prod`
      # excludes devDeps (build/test tooling), so this gates what actually ships.
      # Keeps the svelte/kit XSS class of advisory from silently regressing.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      # Generated-code drift gate. `ui-schema.json` is the single source of
      # truth; the committed schema.ts / UISchema.Generated.cs / SchemaVersion.cs
      # are derived. The generators already error if definitions changed without
      # a schemaVersion bump, but that only fires when someone runs `generate`.
      # This makes CI the backstop: regenerate, then fail if anything differs
      # from what's committed.
      - name: Verify generated code is up to date
        run: |
          pnpm generate
          if ! git diff --exit-code -- \
            packages/schemas/src/generated \
            Plugin/Selva.Schema/Models/UISchema.Generated.cs \
            Plugin/Selva.Schema/Constants/SchemaVersion.cs; then
            echo "::error::Generated code is out of date. Run 'pnpm generate' and commit the result."
            exit 1
          fi

      # Persist ESLint's cache across runs so unchanged files are skipped.
      # Keyed on lint config so a rule change busts the cache; restore-keys
      # let an outdated cache seed a fresh run rather than starting cold.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('eslint.config.*', '.prettierrc*') }}
          restore-keys: |
            eslint-

      # Style checks before tests — they're cheap and fail fast.
      - run: pnpm format:check
      - run: pnpm lint

      # Type-check catches refactor breakage that lint misses. Cheap (~1min)
      # and gates the whole monorepo.
      - run: pnpm type-check

      # Tests read workspace-package source directly via the `"source"` export
      # condition (vitest.config.ts `resolve.conditions: ['source']`), so no
      # platform pre-build step is needed here.
      #
      # @selvajs/supabase-provider IS included: its conformance suites self-skip
      # cleanly without a live stack (they need Supabase creds in .env.test), but
      # its no-stack unit tests — e.g. compute-server apiKey at-rest encryption —
      # run and gate here. A separate workflow with environment secrets can add
      # the live conformance coverage later.
      - run: >-
          pnpm
          --filter @selvajs/local-provider
          --filter @selvajs/supabase-provider
          --filter @selvajs/selva
          test

  # .NET tests for the Rhino-free libraries. Runs on ubuntu in parallel with
  # the JS job. Selva.Tests and Selva.Drawing.Tests both target net8.0 and have
  # NO Rhino/Grasshopper dependency — Selva.Tests references only Selva.Schema
  # and *links* the handful of Rhino-free source files it needs (see its csproj),
  # so the schema migrator / validator now have real CI protection. The
  # Rhino-coupled Selva.GH tests still need a Windows+Rhino runner (future work).
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Cache the NuGet global-packages folder. Keyed on the csproj files (no
      # packages.lock.json exists, so setup-dotnet's built-in cache can't be
      # used); restore-keys seed a fresh run from the last cache. Shares the
      # same key shape as plugin-release.yml, but the OS differs so the entries
      # don't collide.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Plugin/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Schema models, validation, and the SchemaMigrator — the logic that
      # protects user schemas across versions. 103 tests, fully deterministic.
      - name: Test Selva.Schema (migration, validation)
        run: dotnet test Plugin/Selva.Tests/Selva.Tests.csproj --nologo

      # Drawing document model + layout passes, including the SvgRendererSnapshotTests
      # (pinned SVG output). These are deterministic: glyph advances come from the
      # bundled font via FontMetrics, not the host's installed fonts.
      - name: Test Selva.Drawing (model + layout + SVG snapshots)
        run: dotnet test Plugin/Selva.Drawing.Tests/Selva.Drawing.Tests.csproj --nologo
