name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build platform packages so workspace `selva-local-provider` consumers
      # (compute-app tests) have the compiled `dist/` to import from.
      - run: pnpm build:platform

      # Excludes @selva/supabase-provider — needs a live stack with secrets.
      # Add a separate workflow with environment secrets when ready.
      - run: pnpm -r --filter '!@selva/supabase-provider' test
