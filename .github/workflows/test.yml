name: Test

on:
  pull_request:
  # Push + cron catch what the PR trigger misses: admin/direct pushes,
  # Dependabot auto-merges, and advisories that land between merges.
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

# Keyed on workflow too, so push-to-main and PR runs for one ref don't cancel
# each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Must precede `uses: ./...` below — GitHub resolves local actions from
      # the runner's filesystem.
      - uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-test-${{ github.sha }}
          restore-keys: |
            turbo-test-

      # Publish coverage, bundle-only selva, cli/selva fixed-group.
      - name: Check publish invariants
        run: node scripts/publishable-packages.mjs --check

      # --prod excludes devDeps, so this gates only what actually ships.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate

      # ui-schema.json is the source of truth; the generated TS/C# is derived.
      # The generators only error when someone runs them locally — this is the
      # CI backstop.
      - name: Verify generated code is up to date
        run: |
          pnpm generate
          if ! git diff --exit-code -- \
            packages/schemas/src/generated \
            Plugin/Selva.Schema/Models/UISchema.Generated.cs \
            Plugin/Selva.Schema/Constants/SchemaVersion.cs; then
            echo "::error::Generated code is out of date. Run 'pnpm generate' and commit the result."
            exit 1
          fi

      # Keyed on lint config so a rule change busts the cache.
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('eslint.config.*', '.prettierrc*') }}
          restore-keys: |
            eslint-

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check

      # Every package's test task. @selvajs/supabase-provider's live-stack
      # suites self-skip without Supabase creds (no .env.test in CI); its
      # no-stack unit tests still gate.
      - run: pnpm exec turbo run test

  # Rhino-free .NET libraries; runs in parallel with the JS job. The
  # Rhino-coupled Selva.GH tests still need a Windows+Rhino runner.
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Keyed on csproj files: no packages.lock.json exists, so setup-dotnet's
      # built-in cache can't be used.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Plugin/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Test Selva.Schema (migration, validation)
        run: dotnet test Plugin/Selva.Tests/Selva.Tests.csproj --nologo

      # SVG snapshots are deterministic: glyph advances come from the bundled
      # font via FontMetrics, not the host's installed fonts.
      - name: Test Selva.Drawing (model + layout + SVG snapshots)
        run: dotnet test Plugin/Selva.Drawing.Tests/Selva.Drawing.Tests.csproj --nologo
