name: Dependency Review

# Scans dependency-manifest changes on every PR and blocks the merge if a newly
# added/updated dependency carries a known vulnerability or a license we can't
# ship. Complements the two other supply-chain gates:
#   - `pnpm audit --prod` (test.yml) — audits the WHOLE prod tree each run.
#   - CodeQL (codeql.yml) — analyses our own source, not dependencies.
# This one is diff-scoped: it only judges what a PR *introduces*, so it stays
# fast and its failures point at the exact dep the author added.
#
# PR-only by nature — the action diffs the base ref against the head ref, which
# doesn't exist on a bare push.

on:
  pull_request:
    branches: [main, beta]

permissions:
  contents: read
  # Lets the action post its findings as a summary comment on the PR.
  pull-requests: write

jobs:
  dependency-review:
    # The action calls GitHub's dependency-review API, which needs the
    # dependency graph: on by default for public repos, but gated behind
    # GitHub Advanced Security (paid) while the repo is private. Skip rather
    # than fail every PR — this re-enables itself at open-sourcing, no edit
    # needed. Note `pnpm audit --prod` (test.yml) still covers vulnerabilities
    # across the whole prod tree; what's dormant here is the license denylist.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          # Match the moderate floor already used by `pnpm audit` in test.yml.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # This repo ships under MIT. Deny the copyleft licenses that would
          # force downstream relicensing; everything permissive passes. GH's
          # license data is best-effort, so keep this a denylist (block the
          # known-incompatible) rather than an allowlist that trips on
          # unrecognised-but-fine licenses.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
