name: E2E

on:
  pull_request:
  # beta takes direct pushes; without this its first e2e run is the promotion PR.
  push:
    branches: [beta]

# Read-only: this workflow builds and uploads artifacts, never writes to the repo.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # Must precede `uses: ./...` below — GitHub resolves local actions from
      # the runner's filesystem.
      - uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ github.sha }}
          restore-keys: |
            turbo-e2e-

      # Keyed on the installed Playwright version so Chromium is only
      # re-downloaded when @playwright/test bumps.
      # Resolved from @selvajs/selva: the root doesn't hoist @playwright/test.
      # Assigned first so a failed lookup fails the step; inside echo it
      # yielded an empty key that matched a stale cache with no browser.
      - name: Resolve Playwright version
        id: pw
        run: |
          version=$(pnpm --filter @selvajs/selva exec node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}

      # Always run: it skips the download when the cached browser matches, and
      # the OS libraries are never cached.
      - run: pnpm --filter @selvajs/selva exec playwright install --with-deps chromium

      # Via turbo so the `build` dependency fires — Playwright's webServer
      # serves build/index.js (adapter-node).
      - run: pnpm test:e2e --filter=@selvajs/selva
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/selva/playwright-report/
          retention-days: 7
