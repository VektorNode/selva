name: E2E

on:
  pull_request:

# Read-only: this workflow builds and uploads artifacts, never writes to the repo.
permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # Must precede `uses: ./...` below — GitHub resolves local actions from
      # the runner's filesystem.
      - uses: actions/checkout@v7

      - name: Setup workspace
        uses: ./.github/actions/setup

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-e2e-${{ github.sha }}
          restore-keys: |
            turbo-e2e-

      # Keyed on the installed Playwright version so Chromium is only
      # re-downloaded when @playwright/test bumps.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-

      # On a cache hit the browser is present but its OS libraries aren't.
      - run: pnpm --filter @selvajs/selva exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @selvajs/selva exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Via turbo so the `build` dependency fires — Playwright's webServer
      # serves build/index.js (adapter-node).
      - run: pnpm test:e2e --filter=@selvajs/selva
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/selva/playwright-report/
          retention-days: 7
