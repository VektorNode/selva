name: Label Critical Issues

on:
  issues:
    types: [opened]

jobs:
  label-critical:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check if critical and add label
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body ?? '';
            // Both templates use `dropdown` fields, which render as "### <Label>\n\n<Selected option>".
            // Match the section then check its value, instead of matching a hardcoded combined string —
            // resilient to reordering/rewording elsewhere in the template.
            const getSection = (label) => {
              const match = body.match(new RegExp(`### ${label}\\n\\n([^\\n]+)`));
              return match?.[1]?.trim();
            };

            const isCriticalFeature = getSection('Priority') === 'Critical / blocking';
            const isCriticalBug = getSection('Severity') === 'Critical';

            if (isCriticalFeature || isCriticalBug) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['critical']
              });
            }
