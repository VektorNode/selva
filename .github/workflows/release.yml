name: Release

# Publishes from `main` (stable, via version PR) and `beta` (changesets pre mode).
#
# Both flows live in ONE file because npm Trusted Publishing matches on the
# workflow FILENAME — a separate beta workflow would need a second per-package
# publisher entry npm won't grant, and would 404.
#
# Setup this depends on:
# - npm Trusted Publisher entry per package (repo VektorNode/selva + release.yml),
#   for EVERY package in `node scripts/release/publishable-packages.mjs --list`. Missing
#   entries fail with a misleading 404.
# - `id-token: write`, or the OIDC exchange is anonymous and 404s.
# - npm >= 11.5.1 (upgraded below); the Node 20 bundle can't do OIDC.
# - NO NPM_TOKEN secret — its presence overrides OIDC and breaks publishing.

on:
  push:
    branches: [main, beta]
  # Restarts a release whose push GitHub skipped: a squash message that quotes a
  # `[skip ci]` commit skips every workflow on that push.
  workflow_dispatch:

# Cancel superseded beta runs; never interrupt an in-flight main publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/beta' }}

jobs:
  release:
    # A manual run from any other branch would fall through to the main path and publish.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      published: ${{ steps.changesets.outputs.published }}
    # Must be job-level: vite's SSR worker doesn't inherit step-level env, and
    # the Local* provider factories throw on missing env at module load.
    env:
      SELVA_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SELVA_AT_REST_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATA_PATH: /tmp/selva-build
      # Secrets can't be read in `if:`; an env var can.
      BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs full history to compute version diffs
          fetch-depth: 0
          # The branch tip, NOT the SHA that triggered this run. On beta,
          # cancel-in-progress means a burst of pushes leaves one survivor, and
          # that survivor is not always the newest — it then evaluates changeset
          # state at its own older SHA, reports "no unconsumed changesets", and
          # exits green having published nothing. Checking out the tip makes the
          # surviving run release everything on the branch regardless of which
          # push it came from.
          ref: ${{ github.ref }}

      # Cheap and dependency-free, so it runs on the system node before install
      # and before the ~5min test gate. A mixed changeset otherwise fails in
      # `changeset version`, after everything expensive has already passed.
      - name: Validate changesets
        run: node scripts/release/validate-changesets.mjs

      # Outputs: should_run, is_beta, needs_version.
      - name: Check for pending release work
        id: check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            if [ ! -f .changeset/pre.json ]; then
              # Normal between a stable release and `pnpm changeset pre enter beta`. Never version
              # or publish here: without pre mode both produce stable versions on `latest`.
              echo "::warning::.changeset/pre.json missing — beta is not in pre mode, so it does not release."
              echo "Run 'pnpm changeset pre enter beta' on the beta branch to resume beta releases."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # After `pnpm changeset pre exit`, `changeset version` collapses the betas to stable and
            # deletes pre.json, and the publish that follows has no prerelease tag left: it goes to
            # `latest`. A changeset pushed to beta in that window shipped 4.20.0 from beta. Stable
            # versions are cut on main only.
            if ! grep -q '"mode": *"pre"' .changeset/pre.json; then
              echo "::notice::Pre mode is exiting — beta does not release. Merge beta into main to cut the stable version."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # In pre mode `changeset version` does NOT delete a consumed .md —
            # it moves it to `.changeset/pre/`. See the script for why this is
            # not read out of pre.json.
            unconsumed=$(node scripts/release/unconsumed-changesets.mjs | grep -c . || true)
            if [ "$unconsumed" -gt 0 ]; then
              echo "Found $unconsumed unconsumed changeset(s) — version + publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "needs_version=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            while IFS=$'\t' read -r name local_ver _dir; do
              beta_ver=$(npm view "$name@$local_ver" version 2>/dev/null || echo "")
              if [ "$local_ver" != "$beta_ver" ]; then
                echo "$name local=$local_ver npm=${beta_ver:-<none>} — re-publishing."
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "needs_version=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(node scripts/release/publishable-packages.mjs --list)
            echo "No unconsumed changesets and all beta versions match npm — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── main branch ──────────────────────────────────────────────────
          # A beta→main merge that carries ACTIVE pre mode would publish
          # prerelease versions to the `latest` dist-tag. A pre.json in "exit"
          # mode is expected: `changeset version` reads it to collapse betas to
          # stable, and deletes the file itself.
          if [ -f .changeset/pre.json ] && grep -q '"mode": *"pre"' .changeset/pre.json; then
            echo "::error::.changeset/pre.json in pre mode on main — pre mode leaked from beta."
            echo "Run 'pnpm changeset pre exit' and commit before releasing from main."
            exit 1
          fi
          # After `pnpm changeset pre exit` the betas' changesets stay in .changeset/pre/ as the
          # stable changelog, and the root holds none. Counting only the root, a promotion
          # found nothing pending, saw every beta already on npm, and skipped the release.
          if [ -f .changeset/pre.json ] && grep -q '"mode": *"exit"' .changeset/pre.json; then
            echo "Pre mode exiting — versioning the betas to stable."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' ! -name 'config.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count pending changeset(s) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # publishable-packages.mjs must stay dependency-free: this runs on the
          # runner's system node, before pnpm install.
          while IFS=$'\t' read -r name local_ver _dir; do
            # Query the EXACT version, not the `latest` dist-tag — `latest` is a
            # cached read, so a just-published version can still read as the old
            # one and trigger a redundant re-publish.
            npm_ver=$(npm view "$name@$local_ver" version 2>/dev/null || echo "")
            if [ "$local_ver" != "$npm_ver" ]; then
              echo "$name local=$local_ver npm=${npm_ver:-<none>} — proceeding to publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(node scripts/release/publishable-packages.mjs --list)
          echo "No changesets and all published versions match npm — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6.0.10
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-node@v7
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Required for OIDC — without it publishes fall back to anonymous and 404.
      # Trusted publishing needs >= 11.5.1; Node 24 bundles 11.x already, but the
      # bundled patch moves with the runner image, so pin it here.
      #
      # Exact, not a range: this is the version that uploads to the registry, and
      # `@latest` silently adopted each new major the morning it shipped. Bump it
      # deliberately — a broken publish is discovered after the tag exists.
      - name: Upgrade npm for OIDC publishing
        if: steps.check.outputs.should_run == 'true'
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      # No .turbo cache on the release path, deliberately. It was keyed on
      # github.sha, which can never hit exactly, so every run restored some
      # earlier run's entry and saved a fresh ~1.1GB one — six of them held
      # ~6.8GB of the repo's 10GB quota and evicted the caches that do pay off
      # (pnpm store, eslint, nuget). It bought little anyway: `changeset version`
      # rewrites package.json before the gate, and package.json is a build
      # input, so the tasks that dominate this job miss regardless.

      # ── beta path ────────────────────────────────────────────────────────
      # Versioning BEFORE the gate is deliberate, for two reasons:
      #   · `changeset version` rewrites every package.json and every internal
      #     dependency range. Testing the pre-version tree gates a tree that is
      #     not the one being published — a bump that pushes a package outside a
      #     sibling's peer range would ship green.
      #   · package.json is a turbo build input, so versioning after the gate
      #     invalidates every `^build` the gate just did, and `pnpm release`
      #     rebuilds all of it from scratch.
      # Nothing is pushed until the gate passes, so a failing test leaves no
      # version commit behind on beta.
      - name: Version beta packages
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        run: pnpm changeset version

      # Gates the publish: on main, catches regressions in the version-PR merge
      # commit; on beta, runs against the freshly versioned tree.
      - name: Type-check
        if: steps.check.outputs.should_run == 'true'
        run: pnpm type-check

      # svelte-check owns type coverage for the SvelteKit packages (selva,
      # plugin-ui); they have no tsc task, so type-check alone would skip them.
      - name: Check
        if: steps.check.outputs.should_run == 'true'
        run: pnpm check

      - name: Test
        if: steps.check.outputs.should_run == 'true'
        run: pnpm exec turbo run test

      - name: Commit beta version bumps
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        # HUSKY=0 + --no-verify: lint-staged aborts on machine-generated commits.
        env:
          HUSKY: 0
        run: |
          # --porcelain, not `git diff --quiet`: in pre mode `changeset version`
          # rewrites pre.json and adds CHANGELOG.md files, and a plain diff
          # misses untracked ones.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No version changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --no-verify -m "chore: version beta packages [skip ci]"
            # Two pushes close together leave the second non-fast-forward. Rebase
            # onto the new tip and retry rather than failing a run that has
            # already versioned but not yet published. Never --force: a real
            # divergence must fail, not clobber.
            for attempt in 1 2 3; do
              if git push origin HEAD:beta; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto origin/beta."
              git fetch origin beta
              git rebase origin/beta
            done
            echo "::error::Could not push version commit to beta after 3 attempts."
            exit 1
          fi

      # In pre mode `changeset publish` uses the `beta` dist-tag automatically;
      # passing --tag is rejected. So reuse `pnpm release` (build + publish).
      # Second line of defence behind the pre-mode check: whatever versioned this tree, beta never
      # publishes a version without a prerelease suffix, because that publish goes to `latest`.
      # A stable version already on npm is skipped by `changeset publish`, so only unpublished
      # ones count: right after `pre enter` every package not yet bumped still sits at its stable.
      - name: Refuse stable versions on beta
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta == 'true'
        run: |
          stable=""
          while IFS=$'\t' read -r name ver _dir; do
            case "$ver" in *-*) continue ;; esac
            if [ "$(npm view "$name@$ver" version 2>/dev/null)" != "$ver" ]; then
              stable="$stable $name@$ver"
            fi
          done < <(node scripts/release/publishable-packages.mjs --list)
          if [ -n "$stable" ]; then
            echo "::error::Beta would publish stable versions to latest: $(echo $stable)"
            echo "Stable versions are cut on main. Re-enter pre mode or release through main."
            exit 1
          fi

      - name: Build & publish beta
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta == 'true'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A beta run that skips is normal (nothing to release). A beta run that
      # finishes with changesets STILL unconsumed is not — it means the release
      # silently missed work, which is invisible precisely because the run is
      # green. Runs on every beta outcome, including the skip path.
      - name: Verify no beta work was left behind
        if: steps.check.outputs.is_beta == 'true'
        run: |
          # Outside pre mode beta releases nothing; its changesets ship through main.
          if ! grep -qs '"mode": *"pre"' .changeset/pre.json; then
            echo "Beta is not in pre mode — nothing to verify."
            exit 0
          fi
          leftover=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "::error::Changeset '$name' is still unconsumed after the release."
            leftover=$((leftover + 1))
          done < <(node scripts/release/unconsumed-changesets.mjs)
          if [ "$leftover" -gt 0 ]; then
            echo "::error::$leftover changeset(s) were not released. The run checked out \
          $(git rev-parse --short HEAD); if newer commits exist on beta, re-run against the tip."
            exit 1
          fi
          echo "All changesets on this ref are recorded in pre.json."

      # ── main path ────────────────────────────────────────────────────────
      # v2 renamed every input used here (version→version-script,
      # publish→publish-script, commit→commit-message, title→pr-title) and no
      # longer reads GITHUB_TOKEN from the environment — it must be passed as
      # `github-token`. A v1 name under v2 is silently ignored, which would run
      # the action with no version/publish script at all.
      #
      # The version PR is opened with the release bot's token: one opened with
      # GITHUB_TOKEN starts no CI, so main's required checks never report and it
      # cannot merge. Minted here, after install and tests, and without workflow
      # access, so no dependency script runs while it exists.
      - name: Release bot token
        id: bot
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta != 'true' && env.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: changesets/action@v2
        id: changesets
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta != 'true'
        with:
          version-script: pnpm changeset version
          # `pnpm release` = build + publish. The build is required: @selvajs/selva
          # ships a prebuilt SvelteKit artifact, @selvajs/ui compiled components.
          publish-script: pnpm release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          github-token: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}

  # After a stable publish, main holds versions beta has never seen. Merging them
  # back and re-entering pre mode by hand is where releases went wrong: a squash
  # or cherry-pick copied main's commits under new hashes, and the next promotion
  # conflicted in every version line. A conflict here fails this job, never the
  # publish above.
  #
  # A re-run or dispatch that finds nothing left to publish also syncs: a publish
  # that landed in a run that then failed (tags, GitHub releases) never set
  # `published`, and every later run sees the versions already on npm.
  sync-beta:
    needs: release
    if: >-
      github.ref == 'refs/heads/main' && (
        needs.release.outputs.published == 'true' ||
        (needs.release.outputs.should_run == 'false' &&
          (github.run_attempt > 1 || github.event_name == 'workflow_dispatch'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Secrets can't be read in `if:`; an env var can.
    env:
      BOT_APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
    steps:
      # A GITHUB_TOKEN push starts no CI on beta and may not touch
      # .github/workflows/, so a main that changed CI fails the push. The release
      # bot's token does both.
      - name: Release bot token
        id: bot
        if: env.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: beta
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Merge main into beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "beta already contains main."
            exit 0
          fi
          if ! git merge --no-edit -m "chore: merge main into beta after release" origin/main; then
            echo "::error::main does not merge cleanly into beta. Conflicts:"
            git diff --name-only --diff-filter=U
            git merge --abort
            echo "::error::Resolve by hand: on beta, git merge origin/main, resolve, commit, push. Then re-run this job: it re-enters pre mode."
            exit 1
          fi

      # `changeset version` deletes pre.json when it collapses the betas, so
      # after a promotion it is gone. After a release cut on main alone, beta
      # is still in pre mode. A pre.json in "exit" mode means a promotion is
      # still on its way to main: re-entering would carry pre mode into main.
      #
      # Written by hand, not `pnpm changeset pre enter beta`: that needs an
      # install (dependency scripts under this token) and writes 2-space JSON
      # that fails format:check. In @changesets/pre 3.x `pre enter` writes
      # exactly these two fields; recheck on a major upgrade.
      - name: Re-enter beta pre mode
        env:
          HUSKY: 0
        run: |
          if [ -f .changeset/pre.json ]; then
            if grep -q '"mode": *"exit"' .changeset/pre.json; then
              echo "::notice::beta is exiting pre mode: a promotion is in flight. The sync after its stable release re-enters pre mode."
            else
              echo "beta is already in pre mode."
            fi
            exit 0
          fi
          printf '{\n\t"mode": "pre",\n\t"tag": "beta"\n}\n' > .changeset/pre.json
          git add .changeset/pre.json
          git commit --no-verify -m "chore: enter beta pre mode"

      - name: Push beta
        run: |
          if git push origin HEAD:beta; then
            exit 0
          fi
          git fetch origin beta
          if ! git merge-base --is-ancestor origin/beta HEAD; then
            echo "::error::beta moved while this job ran. Re-run this job: it starts again from the new tip."
          elif [ -z "$BOT_APP_ID" ]; then
            echo "::error::Push refused. GITHUB_TOKEN cannot push a merge that changes .github/workflows/, so a re-run fails the same way. Set up the release bot (docs/contributing/publishing.md), then re-run."
          else
            echo "::error::Push refused (see the git error above). A re-run fails the same way until that is fixed."
          fi
          exit 1
