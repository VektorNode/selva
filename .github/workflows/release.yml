name: Release

# Publishes from `main` (stable, via version PR) and `beta` (changesets pre mode).
#
# Both flows live in ONE file because npm Trusted Publishing matches on the
# workflow FILENAME — a separate beta workflow would need a second per-package
# publisher entry npm won't grant, and would 404.
#
# Setup this depends on:
# - npm Trusted Publisher entry per package (repo VektorNode/selva + release.yml),
#   for EVERY package in `node scripts/publishable-packages.mjs --list`. Missing
#   entries fail with a misleading 404.
# - `id-token: write`, or the OIDC exchange is anonymous and 404s.
# - npm >= 11.5.1 (upgraded below); the Node 20 bundle can't do OIDC.
# - NO NPM_TOKEN secret — its presence overrides OIDC and breaks publishing.

on:
  push:
    branches: [main, beta]

# Cancel superseded beta runs; never interrupt an in-flight main publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/beta' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Must be job-level: vite's SSR worker doesn't inherit step-level env, and
    # the Local* provider factories throw on missing env at module load.
    env:
      SELVA_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SELVA_AT_REST_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATA_PATH: /tmp/selva-build
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs full history to compute version diffs
          fetch-depth: 0

      # Outputs: should_run, is_beta, needs_version.
      - name: Check for pending release work
        id: check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            if [ ! -f .changeset/pre.json ]; then
              echo "::error::.changeset/pre.json missing — beta branch is not in pre mode."
              echo "Run 'pnpm changeset pre enter beta' on the beta branch first."
              exit 1
            fi
            # In pre mode `changeset version` does NOT delete the .md — it records
            # it in pre.json. So "unconsumed" = absent from pre.json.changesets.
            unconsumed=0
            for f in $(find .changeset -maxdepth 1 -type f -name '*.md' \
              ! -name 'README.md' ! -name 'config.md'); do
              name=$(basename "$f" .md)
              if ! node -e "process.exit(require('./.changeset/pre.json').changesets.includes('$name') ? 0 : 1)"; then
                unconsumed=$((unconsumed + 1))
              fi
            done
            if [ "$unconsumed" -gt 0 ]; then
              echo "Found $unconsumed unconsumed changeset(s) — version + publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "needs_version=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            while IFS=$'\t' read -r name local_ver _dir; do
              beta_ver=$(npm view "$name@$local_ver" version 2>/dev/null || echo "")
              if [ "$local_ver" != "$beta_ver" ]; then
                echo "$name local=$local_ver npm=${beta_ver:-<none>} — re-publishing."
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "needs_version=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(node scripts/publishable-packages.mjs --list)
            echo "No unconsumed changesets and all beta versions match npm — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── main branch ──────────────────────────────────────────────────
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' ! -name 'config.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count pending changeset(s) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # publishable-packages.mjs must stay dependency-free: this runs on the
          # runner's system node, before pnpm install.
          while IFS=$'\t' read -r name local_ver _dir; do
            # Query the EXACT version, not the `latest` dist-tag — `latest` is a
            # cached read, so a just-published version can still read as the old
            # one and trigger a redundant re-publish.
            npm_ver=$(npm view "$name@$local_ver" version 2>/dev/null || echo "")
            if [ "$local_ver" != "$npm_ver" ]; then
              echo "$name local=$local_ver npm=${npm_ver:-<none>} — proceeding to publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(node scripts/publishable-packages.mjs --list)
          echo "No changesets and all published versions match npm — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6.0.9
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-node@v7
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Required for OIDC — without it publishes fall back to anonymous and 404.
      - name: Upgrade npm for OIDC publishing
        if: steps.check.outputs.should_run == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        if: steps.check.outputs.should_run == 'true'
        with:
          path: .turbo
          key: turbo-release-${{ github.sha }}
          restore-keys: |
            turbo-release-

      # Gates the publish: catches regressions in the version-PR merge commit.
      - name: Type-check
        if: steps.check.outputs.should_run == 'true'
        run: pnpm type-check

      - name: Test
        if: steps.check.outputs.should_run == 'true'
        run: pnpm exec turbo run test

      # ── beta path ────────────────────────────────────────────────────────
      - name: Version beta packages
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        run: pnpm changeset version

      - name: Commit beta version bumps
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        # HUSKY=0 + --no-verify: lint-staged aborts on machine-generated commits.
        env:
          HUSKY: 0
        run: |
          if git diff --quiet; then
            echo "No version changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --no-verify -m "chore: version beta packages [skip ci]"
            # No --force: a non-fast-forward push should fail, not clobber.
            git push origin HEAD:beta
          fi

      # In pre mode `changeset publish` uses the `beta` dist-tag automatically;
      # passing --tag is rejected. So reuse `pnpm release` (build + publish).
      - name: Build & publish beta
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta == 'true'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── main path ────────────────────────────────────────────────────────
      - uses: changesets/action@v1
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta != 'true'
        with:
          version: pnpm changeset version
          # `pnpm release` = build + publish. The build is required: @selvajs/selva
          # ships a prebuilt SvelteKit artifact, @selvajs/ui compiled components.
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
