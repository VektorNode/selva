name: Release

# What this does
# ---------------
# Streamlined publish flow using changesets/action. On every push to `main`:
#
# 1. If there are .changeset/*.md files pending: opens (or updates) a
#    "Version Packages" PR with `pnpm changeset version` applied. Reviewers
#    can read the diff before any publish happens. Merging the PR triggers
#    step 2 on its own push event.
#
# 2. If there are NO pending changesets but the working tree contains
#    bumped versions (the post-version-PR-merge state): runs `pnpm release`,
#    which builds + publishes the four public packages
#    (@selvajs/selva, @selvajs/cli, @selvajs/ui, @selvajs/schemas) in
#    dependency order. Private packages are skipped.
#
# The action figures out which mode to run based on workspace state — no
# branching needed in this file.
#
# What you need set up
# --------------------
# - npm Trusted Publishing (OIDC), configured per package at
#   npmjs.com → <package> → Settings → Trusted Publisher. Each of the four
#   published packages (@selvajs/selva, @selvajs/cli, @selvajs/ui,
#   @selvajs/schemas) needs an entry pointing at this repo
#   (VektorNode/selva) and workflow filename (release.yml). The handshake
#   is per-package, not per-scope — missing entries fail with a misleading
#   404 from `npm publish`.
# - `id-token: write` permission below — required for the GitHub → npm OIDC
#   exchange. Without it the request is anonymous and the publish 404s.
# - `contents: write` + `pull-requests: write` permissions let
#   changesets/action open the version PR.
# - npm ≥ 11.5.1 — older clients don't know how to exchange the OIDC
#   token, so the workflow below upgrades npm before publishing. The npm
#   bundled with Node 20 is too old.
# - No `NPM_TOKEN` secret. If one is set in the environment, npm uses
#   token auth instead of OIDC and the trusted-publisher path never runs.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Job-level env so every step + every subprocess (pnpm → turbo → vite)
    # inherits these. Setting them only on the changesets/action step is
    # not enough — vite spawns a worker for SSR rendering that doesn't get
    # action-level env. See the "providers.server.ts eager evaluation"
    # note in REFACTOR-PLAN.md.
    env:
      # Dummy secrets so SvelteKit's SSR prerender doesn't crash. The Local*
      # provider factories throw on missing env at module load. Runtime
      # overrides with real values via .env.
      SELVA_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SELVA_AT_REST_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATA_PATH: /tmp/selva-build
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs full history to compute version diffs
          fetch-depth: 0

      # Skip the expensive install/test/build path when there's nothing to do.
      # Two cases warrant running:
      #   1. Pending changesets in .changeset/*.md → open/update the version PR
      #   2. Post-version-PR-merge: package.json versions ahead of npm → publish
      # If neither is true (regular code push to main), bail out early.
      - name: Check for pending release work
        id: check
        run: |
          # Count .changeset/*.md files, excluding README.md and config.md.
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' ! -name 'config.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count pending changeset(s) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No changesets — check if the last commit is a version bump
          # (changesets/action commits as "chore: version packages").
          last_msg=$(git log -1 --pretty=%s)
          case "$last_msg" in
            "chore: version packages"*)
              echo "Detected post-version-PR-merge commit — proceeding to publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "No changesets and no version-bump commit — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v3
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Upgrade npm so `changeset publish` can perform the OIDC handshake
      # with the registry. The npm shipped with Node 20 predates Trusted
      # Publishing support; without this, publishes silently fall back to
      # anonymous and 404 on the PUT.
      - name: Upgrade npm for OIDC publishing
        if: steps.check.outputs.should_run == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      # Run tests + type-check before letting changesets near publishing.
      # Catches regressions in the version-bump-PR merge commit. If you need
      # to ship despite a known-flaky test, add it to vitest's skip list
      # rather than removing this guard.
      - name: Type-check
        if: steps.check.outputs.should_run == 'true'
        run: pnpm type-check

      - name: Test
        if: steps.check.outputs.should_run == 'true'
        # @selvajs/local-provider is the only suite with hard coverage
        # requirements today. @selvajs/selva's tests pass assertions but
        # exit 1 from a cleanup race — see the issue tracker. Run the
        # ones we trust here; the rest are best-effort.
        run: pnpm --filter=@selvajs/local-provider test

      - uses: changesets/action@v1
        if: steps.check.outputs.should_run == 'true'
        with:
          # `pnpm changeset version` consumes .changeset/*.md, bumps
          # package.json versions across the fixed-mode group, and writes
          # CHANGELOGs. The fixed-mode config in .changeset/config.json
          # keeps @selvajs/selva, @selvajs/cli, @selvajs/ui, @selvajs/schemas
          # at one shared version.
          version: pnpm changeset version

          # `pnpm release` runs `pnpm build && changeset publish`. The
          # build step is critical — @selvajs/selva ships a prebuilt
          # SvelteKit artifact and @selvajs/ui ships compiled .svelte
          # components.
          publish: pnpm release

          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN here on purpose — auth happens via OIDC trusted
          # publishing. Setting NPM_TOKEN would override OIDC and break
          # publishing if the token is missing/expired/under-permissioned.
