name: Release

# What this does
# ---------------
# Handles BOTH the stable (`main`) and beta (`beta`) publish flows from one
# workflow — deliberately, because npm Trusted Publishing matches on the
# workflow FILENAME and allows one publisher per package. Splitting beta into
# its own file would need a second per-package trusted-publisher entry npm
# won't grant, and publishes 404. So beta rides release.yml's identity.
#
# BETA branch (changesets "pre mode"): push a changeset to `beta` (which must
# have run `pnpm changeset pre enter beta`, committing .changeset/pre.json) and
# this versions the affected packages as `x.y.z-beta.N`, commits the bump back
# to `beta`, and publishes them under the npm `beta` dist-tag — no version PR.
# `npm i pkg` still resolves stable; `npm i pkg@beta` gets the prerelease.
# Exit the cycle with `pnpm changeset pre exit` on `beta`, then merge to main.
#
# MAIN branch — streamlined publish flow using changesets/action. On every push:
#
# 1. If there are .changeset/*.md files pending: opens (or updates) a
#    "Version Packages" PR with `pnpm changeset version` applied. Reviewers
#    can read the diff before any publish happens. Merging the PR triggers
#    step 2 on its own push event.
#
# 2. If there are NO pending changesets but the working tree contains
#    bumped versions (the post-version-PR-merge state): runs `pnpm release`,
#    which builds + publishes the four public packages
#    (@selvajs/selva, @selvajs/cli, @selvajs/ui, @selvajs/schemas) in
#    dependency order. Private packages are skipped.
#
# The action figures out which mode to run based on workspace state — no
# branching needed in this file.
#
# What you need set up
# --------------------
# - npm Trusted Publishing (OIDC), configured per package at
#   npmjs.com → <package> → Settings → Trusted Publisher. Each of the four
#   published packages (@selvajs/selva, @selvajs/cli, @selvajs/ui,
#   @selvajs/schemas) needs an entry pointing at this repo
#   (VektorNode/selva) and workflow filename (release.yml). The handshake
#   is per-package, not per-scope — missing entries fail with a misleading
#   404 from `npm publish`.
# - `id-token: write` permission below — required for the GitHub → npm OIDC
#   exchange. Without it the request is anonymous and the publish 404s.
# - `contents: write` + `pull-requests: write` permissions let
#   changesets/action open the version PR.
# - npm ≥ 11.5.1 — older clients don't know how to exchange the OIDC
#   token, so the workflow below upgrades npm before publishing. The npm
#   bundled with Node 20 is too old.
# - No `NPM_TOKEN` secret. If one is set in the environment, npm uses
#   token auth instead of OIDC and the trusted-publisher path never runs.

on:
  push:
    branches: [main, beta]

# Per-ref so main and beta never collide. On beta we cancel in-flight runs
# (a newer push supersedes — its checkout already has the older bump commit);
# on main we don't, to avoid interrupting an in-progress publish. The
# expression yields true only for beta.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/beta' }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Job-level env so every step + every subprocess (pnpm → turbo → vite)
    # inherits these. Setting them only on the changesets/action step is
    # not enough — vite spawns a worker for SSR rendering that doesn't get
    # action-level env. See the "providers.server.ts eager evaluation"
    # note in REFACTOR-PLAN.md.
    env:
      # Dummy secrets so SvelteKit's SSR prerender doesn't crash. The Local*
      # provider factories throw on missing env at module load. Runtime
      # overrides with real values via .env.
      SELVA_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SELVA_AT_REST_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATA_PATH: /tmp/selva-build
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets needs full history to compute version diffs
          fetch-depth: 0

      # Decide whether to run, and via which path. Outputs:
      #   should_run    — gate every heavy step below
      #   is_beta       — true on the beta branch (pre-release publish path)
      #   needs_version — beta-only: run `changeset version` (vs. re-publish an
      #                   already-bumped version whose publish failed)
      #
      # MAIN: same as before — pending changesets open/update the version PR;
      # a post-merge bump (local version ahead of npm) triggers publish.
      #
      # BETA: changesets "pre mode". A changeset .md is NOT deleted by
      # `changeset version` in pre mode — it's recorded in pre.json and left on
      # disk until `pre exit`, so an UNCONSUMED changeset (basename absent from
      # pre.json.changesets) means "version a new -beta.N". Otherwise, if a
      # local version is ahead of its `beta` dist-tag on npm, a prior run
      # versioned but failed to publish → re-publish without re-versioning.
      - name: Check for pending release work
        id: check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            if [ ! -f .changeset/pre.json ]; then
              echo "::error::.changeset/pre.json missing — beta branch is not in pre mode."
              echo "Run 'pnpm changeset pre enter beta' on the beta branch first."
              exit 1
            fi
            # Count changesets not yet consumed this pre-cycle.
            unconsumed=0
            for f in $(find .changeset -maxdepth 1 -type f -name '*.md' \
              ! -name 'README.md' ! -name 'config.md'); do
              name=$(basename "$f" .md)
              if ! node -e "process.exit(require('./.changeset/pre.json').changesets.includes('$name') ? 0 : 1)"; then
                unconsumed=$((unconsumed + 1))
              fi
            done
            if [ "$unconsumed" -gt 0 ]; then
              echo "Found $unconsumed unconsumed changeset(s) — version + publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "needs_version=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # No new changesets — re-publish if a local version is ahead of npm's beta tag.
            while IFS=$'\t' read -r name local_ver _dir; do
              beta_ver=$(npm view "$name@beta" version 2>/dev/null || echo "")
              if [ "$local_ver" != "$beta_ver" ]; then
                echo "$name local=$local_ver beta=${beta_ver:-<none>} — re-publishing."
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "needs_version=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(node scripts/publishable-packages.mjs --list)
            echo "No unconsumed changesets and all beta versions match npm — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── main branch ──────────────────────────────────────────────────
          # Count .changeset/*.md files, excluding README.md and config.md.
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' ! -name 'config.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count pending changeset(s) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No changesets — we're in the post-version-PR-merge state if any
          # published package's local version is ahead of what's on npm. This
          # is merge-style-agnostic: it works whether the version PR was
          # squash-merged (subject "chore: version packages") or merged as a
          # merge commit (subject "Merge pull request ..."), which the old
          # commit-subject check missed and silently skipped the publish.
          #
          # The publishable set is DERIVED from the workspace (every package
          # with private!=true), not hardcoded. The old `selva cli ui schemas`
          # list omitted @selvajs/platform + the providers, so a provider-only
          # bump bumped package.json/CHANGELOG but never published — silently
          # breaking consumers (parafa) that pin `@selvajs/platform ^0.12.0`.
          # scripts/publishable-packages.mjs is dependency-free so it runs here
          # on the runner's system node, before `pnpm install`.
          while IFS=$'\t' read -r name local_ver _dir; do
            # `npm view` exits non-zero / empty for never-published packages;
            # treat that as "needs publish" too.
            npm_ver=$(npm view "$name" version 2>/dev/null || echo "")
            if [ "$local_ver" != "$npm_ver" ]; then
              echo "$name local=$local_ver npm=${npm_ver:-<none>} — proceeding to publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(node scripts/publishable-packages.mjs --list)
          echo "No changesets and all published versions match npm — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v3
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Upgrade npm so `changeset publish` can perform the OIDC handshake
      # with the registry. The npm shipped with Node 20 predates Trusted
      # Publishing support; without this, publishes silently fall back to
      # anonymous and 404 on the PUT.
      - name: Upgrade npm for OIDC publishing
        if: steps.check.outputs.should_run == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      # Persist Turbo's local task cache so `pnpm release` (→ pnpm build) can
      # reuse unchanged package builds across releases. Turbo hashes inputs
      # itself; the SHA key writes a fresh entry and restore-keys warm-seed
      # from the latest prior cache. This is local-only — it won't reuse builds
      # produced by the PR test/e2e runs (that needs a remote cache), but it
      # warms successive release runs.
      - uses: actions/cache@v4
        if: steps.check.outputs.should_run == 'true'
        with:
          path: .turbo
          key: turbo-release-${{ github.sha }}
          restore-keys: |
            turbo-release-

      # Run tests + type-check before letting changesets near publishing.
      # Catches regressions in the version-bump-PR merge commit. If you need
      # to ship despite a known-flaky test, add it to vitest's skip list
      # rather than removing this guard.
      - name: Type-check
        if: steps.check.outputs.should_run == 'true'
        run: pnpm type-check

      - name: Test
        if: steps.check.outputs.should_run == 'true'
        # @selvajs/local-provider is the only suite with hard coverage
        # requirements today. @selvajs/selva's tests pass assertions but
        # exit 1 from a cleanup race — see the issue tracker. Run the
        # ones we trust here; the rest are best-effort.
        run: pnpm --filter=@selvajs/local-provider test

      # ── beta path: version (pre-release), commit the bump back, publish ───
      # In pre mode, plain `changeset publish` publishes under the `beta`
      # dist-tag automatically — passing `--tag` is REJECTED ("custom tag not
      # allowed in pre mode"), so we reuse `pnpm release` (build + publish).
      - name: Version beta packages
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        run: pnpm changeset version

      - name: Commit beta version bumps
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        # HUSKY=0 + --no-verify: the repo pre-commit hook runs lint-staged,
        # which aborts on a no-op commit. CI bumps are machine-generated.
        env:
          HUSKY: 0
        run: |
          if git diff --quiet; then
            echo "No version changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --no-verify -m "chore: version beta packages [skip ci]"
            # No --force: a non-fast-forward push fails the job rather than
            # clobbering. The concurrency guard makes the race rare; re-running
            # on the latest commit is the recovery path.
            git push origin HEAD:beta
          fi

      - name: Build & publish beta
        if: steps.check.outputs.is_beta == 'true'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — auth via OIDC trusted publishing (this workflow
          # filename, release.yml, is the package's registered publisher).

      # ── main path: changesets/action opens the version PR / publishes ─────
      - uses: changesets/action@v1
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta != 'true'
        with:
          # `pnpm changeset version` consumes .changeset/*.md, bumps
          # package.json versions, and writes CHANGELOGs. The `fixed` group in
          # .changeset/config.json is intentionally narrow: only
          # @selvajs/selva + @selvajs/cli share a version, so their MAJOR
          # versions stay aligned (the `selva doctor` cli/runtime compat
          # check). @selvajs/ui, @selvajs/schemas, @selvajs/platform and the
          # providers version INDEPENDENTLY on their own changesets — they're
          # consumed standalone from npm (parafa/parapet), so lockstepping
          # them to selva would just inflate their versions.
          version: pnpm changeset version

          # `pnpm release` runs `pnpm build && changeset publish`. The
          # build step is critical — @selvajs/selva ships a prebuilt
          # SvelteKit artifact and @selvajs/ui ships compiled .svelte
          # components.
          publish: pnpm release

          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN here on purpose — auth happens via OIDC trusted
          # publishing. Setting NPM_TOKEN would override OIDC and break
          # publishing if the token is missing/expired/under-permissioned.
