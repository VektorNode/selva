name: Release

# Publishes from `main` (stable, via version PR) and `beta` (changesets pre mode).
#
# Both flows live in ONE file because npm Trusted Publishing matches on the
# workflow FILENAME — a separate beta workflow would need a second per-package
# publisher entry npm won't grant, and would 404.
#
# Setup this depends on:
# - npm Trusted Publisher entry per package (repo VektorNode/selva + release.yml),
#   for EVERY package in `node scripts/publishable-packages.mjs --list`. Missing
#   entries fail with a misleading 404.
# - `id-token: write`, or the OIDC exchange is anonymous and 404s.
# - npm >= 11.5.1 (upgraded below); the Node 20 bundle can't do OIDC.
# - NO NPM_TOKEN secret — its presence overrides OIDC and breaks publishing.

on:
  push:
    branches: [main, beta]

# Cancel superseded beta runs; never interrupt an in-flight main publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/beta' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    # Must be job-level: vite's SSR worker doesn't inherit step-level env, and
    # the Local* provider factories throw on missing env at module load.
    env:
      SELVA_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SELVA_AT_REST_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATA_PATH: /tmp/selva-build
    steps:
      - uses: actions/checkout@v7
        with:
          # changesets needs full history to compute version diffs
          fetch-depth: 0
          # The branch tip, NOT the SHA that triggered this run. On beta,
          # cancel-in-progress means a burst of pushes leaves one survivor, and
          # that survivor is not always the newest — it then evaluates changeset
          # state at its own older SHA, reports "no unconsumed changesets", and
          # exits green having published nothing. Checking out the tip makes the
          # surviving run release everything on the branch regardless of which
          # push it came from.
          ref: ${{ github.ref }}

      # Cheap and dependency-free, so it runs on the system node before install
      # and before the ~5min test gate. A mixed changeset otherwise fails in
      # `changeset version`, after everything expensive has already passed.
      - name: Validate changesets
        run: node scripts/validate-changesets.mjs

      # Outputs: should_run, is_beta, needs_version.
      - name: Check for pending release work
        id: check
        run: |
          if [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            if [ ! -f .changeset/pre.json ]; then
              echo "::error::.changeset/pre.json missing — beta branch is not in pre mode."
              echo "Run 'pnpm changeset pre enter beta' on the beta branch first."
              exit 1
            fi
            # In pre mode `changeset version` does NOT delete the .md — it records
            # it in pre.json. So "unconsumed" = absent from pre.json.changesets.
            unconsumed=0
            for f in $(find .changeset -maxdepth 1 -type f -name '*.md' \
              ! -name 'README.md' ! -name 'config.md'); do
              name=$(basename "$f" .md)
              if ! node -e "process.exit(require('./.changeset/pre.json').changesets.includes('$name') ? 0 : 1)"; then
                unconsumed=$((unconsumed + 1))
              fi
            done
            if [ "$unconsumed" -gt 0 ]; then
              echo "Found $unconsumed unconsumed changeset(s) — version + publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "needs_version=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            while IFS=$'\t' read -r name local_ver _dir; do
              beta_ver=$(npm view "$name@$local_ver" version 2>/dev/null || echo "")
              if [ "$local_ver" != "$beta_ver" ]; then
                echo "$name local=$local_ver npm=${beta_ver:-<none>} — re-publishing."
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                echo "needs_version=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done < <(node scripts/publishable-packages.mjs --list)
            echo "No unconsumed changesets and all beta versions match npm — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── main branch ──────────────────────────────────────────────────
          # A beta→main merge that carries pre.json along would publish
          # prerelease versions to the `latest` dist-tag.
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json present on main — pre mode leaked from beta."
            echo "Run 'pnpm changeset pre exit' and commit before releasing from main."
            exit 1
          fi
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' ! -name 'config.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count pending changeset(s) — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # publishable-packages.mjs must stay dependency-free: this runs on the
          # runner's system node, before pnpm install.
          while IFS=$'\t' read -r name local_ver _dir; do
            # Query the EXACT version, not the `latest` dist-tag — `latest` is a
            # cached read, so a just-published version can still read as the old
            # one and trigger a redundant re-publish.
            npm_ver=$(npm view "$name@$local_ver" version 2>/dev/null || echo "")
            if [ "$local_ver" != "$npm_ver" ]; then
              echo "$name local=$local_ver npm=${npm_ver:-<none>} — proceeding to publish."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(node scripts/publishable-packages.mjs --list)
          echo "No changesets and all published versions match npm — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-node@v7
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Required for OIDC — without it publishes fall back to anonymous and 404.
      - name: Upgrade npm for OIDC publishing
        if: steps.check.outputs.should_run == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      # No .turbo cache on the release path, deliberately. It was keyed on
      # github.sha, which can never hit exactly, so every run restored some
      # earlier run's entry and saved a fresh ~1.1GB one — six of them held
      # ~6.8GB of the repo's 10GB quota and evicted the caches that do pay off
      # (pnpm store, eslint, nuget). It bought little anyway: `changeset version`
      # rewrites package.json before the gate, and package.json is a build
      # input, so the tasks that dominate this job miss regardless.

      # ── beta path ────────────────────────────────────────────────────────
      # Versioning BEFORE the gate is deliberate, for two reasons:
      #   · `changeset version` rewrites every package.json and every internal
      #     dependency range. Testing the pre-version tree gates a tree that is
      #     not the one being published — a bump that pushes a package outside a
      #     sibling's peer range would ship green.
      #   · package.json is a turbo build input, so versioning after the gate
      #     invalidates every `^build` the gate just did, and `pnpm release`
      #     rebuilds all of it from scratch.
      # Nothing is pushed until the gate passes, so a failing test leaves no
      # version commit behind on beta.
      - name: Version beta packages
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        run: pnpm changeset version

      # Gates the publish: on main, catches regressions in the version-PR merge
      # commit; on beta, runs against the freshly versioned tree.
      - name: Type-check
        if: steps.check.outputs.should_run == 'true'
        run: pnpm type-check

      - name: Test
        if: steps.check.outputs.should_run == 'true'
        run: pnpm exec turbo run test

      - name: Commit beta version bumps
        if: steps.check.outputs.is_beta == 'true' && steps.check.outputs.needs_version == 'true'
        # HUSKY=0 + --no-verify: lint-staged aborts on machine-generated commits.
        env:
          HUSKY: 0
        run: |
          # --porcelain, not `git diff --quiet`: in pre mode `changeset version`
          # rewrites pre.json and adds CHANGELOG.md files, and a plain diff
          # misses untracked ones.
          if [ -z "$(git status --porcelain)" ]; then
            echo "No version changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --no-verify -m "chore: version beta packages [skip ci]"
            # Two pushes close together leave the second non-fast-forward. Rebase
            # onto the new tip and retry rather than failing a run that has
            # already versioned but not yet published. Never --force: a real
            # divergence must fail, not clobber.
            for attempt in 1 2 3; do
              if git push origin HEAD:beta; then
                exit 0
              fi
              echo "Push rejected (attempt $attempt) — rebasing onto origin/beta."
              git fetch origin beta
              git rebase origin/beta
            done
            echo "::error::Could not push version commit to beta after 3 attempts."
            exit 1
          fi

      # In pre mode `changeset publish` uses the `beta` dist-tag automatically;
      # passing --tag is rejected. So reuse `pnpm release` (build + publish).
      - name: Build & publish beta
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta == 'true'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A beta run that skips is normal (nothing to release). A beta run that
      # finishes with changesets STILL unconsumed is not — it means the release
      # silently missed work, which is invisible precisely because the run is
      # green. Runs on every beta outcome, including the skip path.
      - name: Verify no beta work was left behind
        if: steps.check.outputs.is_beta == 'true'
        run: |
          leftover=0
          for f in $(find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' ! -name 'config.md'); do
            name=$(basename "$f" .md)
            if ! node -e "process.exit(require('./.changeset/pre.json').changesets.includes('$name') ? 0 : 1)"; then
              echo "::error::Changeset '$name' is still unconsumed after the release."
              leftover=$((leftover + 1))
            fi
          done
          if [ "$leftover" -gt 0 ]; then
            echo "::error::$leftover changeset(s) were not released. The run checked out \
          $(git rev-parse --short HEAD); if newer commits exist on beta, re-run against the tip."
            exit 1
          fi
          echo "All changesets on this ref are recorded in pre.json."

      # ── main path ────────────────────────────────────────────────────────
      - uses: changesets/action@v1
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.is_beta != 'true'
        with:
          version: pnpm changeset version
          # `pnpm release` = build + publish. The build is required: @selvajs/selva
          # ships a prebuilt SvelteKit artifact, @selvajs/ui compiled components.
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
