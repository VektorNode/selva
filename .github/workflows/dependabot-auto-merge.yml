name: Dependabot Auto-Merge

# Branch protection is unavailable on this plan (private repo, no Pro), so this
# workflow IS the merge gate — not a convenience layer on top of one. It must
# verify CI itself before approving.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  dependabot-auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3

      # `gh pr checks --watch` can't be used: this job's own check run appears
      # in the PR's checks and would make --watch wait on itself forever. Poll
      # instead, excluding our own workflow from the set.
      - name: Wait for CI checks
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$(( $(date +%s) + 45 * 60 ))
          grace_until=$(( $(date +%s) + 3 * 60 ))
          while :; do
            # `|| true`: gh exits non-zero while checks are pending; drive off JSON.
            others=$(gh pr checks "$PR_URL" --json name,bucket 2>/dev/null || echo '[]')
            others=$(echo "$others" | jq '[.[] | select(.name != "Dependabot Auto-Merge")]')

            if echo "$others" | jq -e 'any(.[]; .bucket == "fail")' >/dev/null; then
              echo "::error::A check failed — refusing to auto-merge."
              echo "$others" | jq -r '.[] | select(.bucket == "fail") | "  ✗ \(.name)"'
              exit 1
            fi

            count=$(echo "$others" | jq 'length')
            pending=$(echo "$others" | jq '[.[] | select(.bucket == "pending")] | length')

            # An empty set inside the grace window means CI hasn't registered
            # its check runs yet — concluding now would skip the gate entirely.
            if [ "$count" -eq 0 ] && [ "$(date +%s)" -lt "$grace_until" ]; then
              echo "no checks registered yet…"
            elif [ "$pending" -eq 0 ]; then
              echo "All $count check(s) concluded without failure."
              exit 0
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 45m waiting for checks."
              exit 1
            fi
            sleep 30
          done

      - name: Approve and merge (non-major)
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      - name: Flag major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "$PR_URL" --body "⚠️ **Major version update** — needs manual review before merging."
