name: Release (beta)

# What this does
# ---------------
# Prerelease publish flow using changesets "pre mode". On every push to the
# `beta` branch that carries pending changesets, this versions the affected
# packages as `x.y.z-beta.N` and publishes them to npm under the `beta`
# dist-tag (so `npm install @selvajs/selva` still resolves to the latest
# stable, while `@selvajs/selva@beta` resolves to the prerelease).
#
# Unlike release.yml (main), there is NO version PR — betas publish directly
# on push. Betas are throwaway; the PR ceremony adds friction.
#
# Prerequisites on the `beta` branch
# ----------------------------------
# Pre mode must be entered ONCE, locally, and committed to `beta`:
#
#     git checkout beta
#     pnpm changeset pre enter beta
#     git add .changeset/pre.json && git commit -m "chore: enter beta pre mode"
#     git push
#
# `.changeset/pre.json` is what makes `changeset version` emit `-beta.N`
# suffixes instead of clean versions. Without it on the branch this workflow
# would publish stable versions to the beta tag — wrong. The guard below
# fails fast if pre.json is missing.
#
# When done with the beta cycle, exit pre mode on `beta` and merge to main:
#
#     pnpm changeset pre exit
#     git commit -am "chore: exit beta pre mode"
#
# Trusted Publishing note
# -----------------------
# Same OIDC setup as release.yml. The npm Trusted Publisher handshake is
# per-package, keyed on repo + workflow filename. Each of the four published
# packages needs a SECOND trusted-publisher entry pointing at THIS workflow
# (release-beta.yml) in addition to the release.yml one, or the beta publish
# 404s. See release.yml's header for the full rationale.

on:
  push:
    branches: [beta]

# Serialize beta runs. Unlike main (which only opens a PR), this workflow
# pushes version bumps back to `beta`, so two overlapping runs would race on
# the same ref. We can't use branch protection (private repo, plan without
# it), so we cancel any in-flight run when a newer push arrives — the newer
# checkout already contains the older push's commits.
concurrency:
  group: release-beta
  cancel-in-progress: true

jobs:
  release-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # Dummy secrets so SvelteKit's SSR prerender doesn't crash at build —
      # same reasoning as release.yml.
      SELVA_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SELVA_AT_REST_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATA_PATH: /tmp/selva-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Decide whether to run. Two cases warrant work, mirroring release.yml:
      #   1. Pending .changeset/*.md → version + publish a new -beta.N.
      #   2. No pending changesets, but a published package's local version is
      #      ahead of its `beta` dist-tag on npm → a prior run versioned but
      #      failed to publish (e.g. the publish step errored). Re-publish
      #      without re-versioning. This makes the workflow self-healing.
      # Always requires pre mode (.changeset/pre.json) to be active.
      - name: Check for pending beta release work
        id: check
        run: |
          if [ ! -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json missing — beta branch is not in pre mode."
            echo "Run 'pnpm changeset pre enter beta' on the beta branch first."
            exit 1
          fi
          # Count .changeset/*.md files, excluding README.md and config.md.
          count=$(find .changeset -maxdepth 1 -type f -name '*.md' \
            ! -name 'README.md' ! -name 'config.md' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count pending changeset(s) — version + publish."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "needs_version=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No changesets — is any published package's local version ahead of
          # what's tagged `beta` on npm? If so, a prior version succeeded but
          # the publish didn't; re-publish without re-versioning.
          while IFS=$'\t' read -r name local_ver _dir; do
            beta_ver=$(npm view "$name@beta" version 2>/dev/null || echo "")
            if [ "$local_ver" != "$beta_ver" ]; then
              echo "$name local=$local_ver beta=${beta_ver:-<none>} — re-publishing."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "needs_version=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < <(node scripts/publishable-packages.mjs --list)
          echo "No changesets and all beta versions match npm — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v3
        if: steps.check.outputs.should_run == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.should_run == 'true'
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm ≥ 11.5.1 is required for the OIDC trusted-publishing handshake.
      - name: Upgrade npm for OIDC publishing
        if: steps.check.outputs.should_run == 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        if: steps.check.outputs.should_run == 'true'
        with:
          path: .turbo
          key: turbo-release-beta-${{ github.sha }}
          restore-keys: |
            turbo-release-beta-
            turbo-release-

      - name: Type-check
        if: steps.check.outputs.should_run == 'true'
        run: pnpm type-check

      - name: Test
        if: steps.check.outputs.should_run == 'true'
        run: pnpm --filter=@selvajs/local-provider test

      # Consume the changesets: bump to x.y.z-beta.N + write CHANGELOGs, then
      # build and publish under the `beta` dist-tag. We commit the version
      # bumps back to the beta branch so the -beta.N counter advances on the
      # next push (changesets reads existing versions to compute N+1).
      - name: Version beta packages
        if: steps.check.outputs.needs_version == 'true'
        run: pnpm changeset version

      - name: Commit version bumps
        if: steps.check.outputs.needs_version == 'true'
        run: |
          if git diff --quiet; then
            echo "No version changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: version beta packages [skip ci]"
            # No --force: a non-fast-forward push (the branch moved under us)
            # fails the job rather than clobbering. Re-running on the latest
            # commit is the recovery path. The concurrency guard above makes
            # this race rare; this is the belt-and-braces backstop.
            git push origin HEAD:beta
          fi

      # Plain `pnpm release` (build + `changeset publish`), NOT a custom
      # --tag. In pre mode, changesets publishes under the pre-tag name
      # automatically (here: the `beta` dist-tag) and REJECTS an explicit
      # `--tag` with "Releasing under custom tag is not allowed in pre mode".
      - name: Build & publish beta
        if: steps.check.outputs.should_run == 'true'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN — auth via OIDC trusted publishing.
