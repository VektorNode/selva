name: Plugin Release

# Builds and publishes the Grasshopper plugin (.yak) on a `plugin-v*` tag.
# Separate from release.yml: the plugin has its own version line
# (Selva.GH.csproj <Version>) and cadence.
#
# Trigger: git tag plugin-v0.10.4 && git push origin plugin-v0.10.4
#
# Requires secret YAK_TOKEN: get it via `yak login` locally, then copy
# `credentials.token` from %APPDATA%\McNeel\yak.yml. yak reads the env var
# directly — no yak.yml needs to exist on the runner.
#
# windows-latest is required: the Rhino 9 leg and Selva.PluginVerifier need WindowsForms.
# No Rhino install needed (builds against NuGet, ExcludeAssets=runtime).

on:
  push:
    tags:
      - 'plugin-v*'

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plugin-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the stable-from-main check needs main's history

      # Backstop for scripts/release-plugin.js: a hand-pushed tag skips its checks. A stable
      # version (no -suffix) must sit on main, so nothing on beta can publish one.
      - name: Stable releases only from main
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^plugin-v', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+-beta\.\d+$' -and $ver -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version ($ver) is neither x.y.z nor x.y.z-beta.N."
            exit 1
          }
          if ($ver -match '-') { exit 0 }
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Stable tag $env:GITHUB_REF_NAME is not on main. Merge to main first, or use a -beta.N version."
            exit 1
          }

      # The .yak version comes from the csproj, not the tag — a mismatch would
      # publish a package whose internal version disagrees with its tag.
      - name: Verify tag matches csproj version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^plugin-v', ''
          [xml]$csproj = Get-Content Plugin/Selva.GH/Selva.GH.csproj
          $ver = @($csproj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          Write-Host "tag=$tag  csproj <Version>=$ver"
          if ($tag -ne $ver) {
            Write-Error "Tag version ($tag) != Selva.GH.csproj <Version> ($ver). Bump the csproj or fix the tag."
            exit 1
          }

      # Before the build, so a tag pushed by hand without a changelog section
      # fails here instead of publishing to Yak. `pnpm release:plugin` cuts it.
      - name: Extract release notes from Plugin/CHANGELOG.md
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^plugin-v', ''
          node scripts/plugin-changelog.mjs notes $ver > "$env:RUNNER_TEMP/notes.md"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Keyed on csproj files: no packages.lock.json exists, so setup-dotnet's
      # built-in cache can't be used.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Plugin/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-plugin-${{ github.sha }}
          restore-keys: |
            turbo-plugin-

      # Standalone download (no Rhino required). Must be on PATH so
      # scripts/build-production.js can shell out to `yak build`.
      # Pinned: tools/latest/ is frozen at 0.12.20, which throws a
      # NullReferenceException in GetInspector on Selva.Panel.rhp. 0.19.1 runs on
      # .NET 10 (installed above). Versions: developer.rhino3d.com/guides/yak/yak-cli-reference
      - name: Install Yak CLI
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\yak"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri 'https://files.mcneel.com/yak/tools/0.19.1/win-x64/yak.exe' -OutFile "$dir\yak.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & "$dir\yak.exe" version

      - name: Build plugin + yak packages
        run: pnpm run build:plugin

      # Yak rejects re-pushing an existing version, so re-running an
      # already-published tag fails loudly (intended).
      - name: Push to Yak registry
        shell: pwsh
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        run: |
          if (-not $env:YAK_TOKEN) { Write-Error 'YAK_TOKEN secret is not set.'; exit 1 }
          $packages = Get-ChildItem -Path Plugin/Selva.GH/bin/Yak -Recurse -Filter *.yak
          if ($packages.Count -eq 0) { Write-Error 'No .yak packages were produced.'; exit 1 }
          foreach ($p in $packages) {
            Write-Host "Pushing $($p.Name)"
            yak push --source https://yak.rhino3d.com $p.FullName
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packages = Get-ChildItem -Path Plugin/Selva.GH/bin/Yak -Recurse -Filter *.yak | ForEach-Object { $_.FullName }
          $ghArgs = @(
            $env:GITHUB_REF_NAME
          ) + $packages + @(
            '--title', "Selva Plugin $env:GITHUB_REF_NAME",
            '--notes-file', "$env:RUNNER_TEMP/notes.md"
          )
          if ($env:GITHUB_REF_NAME -match '-beta') { $ghArgs += '--prerelease' }
          gh release create @ghArgs
