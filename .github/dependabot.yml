version: 2

# One grouped PR per ecosystem per week. Grouping is the point: a single PR
# means one CI run and one auto-merge (see dependabot-auto-merge.yml) instead of
# a dozen. Majors are split out so a breaking bump never rides along with
# routine patches — that workflow refuses to auto-merge them.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      npm:
        update-types: ['minor', 'patch']
      npm-major:
        update-types: ['major']

  # '/' only covers .github/workflows/. Composite actions live outside that
  # scope and silently lag behind (pnpm/setup-node sat at v4 while every
  # workflow moved to v6/v7) unless their directory is listed explicitly.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/setup'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      actions:
        update-types: ['minor', 'patch']
      actions-major:
        update-types: ['major']

  # '/Plugin' covers every *.csproj beneath it: Selva.GH, Selva.Rhino,
  # Selva.Schema, Selva.Drawing and their test projects.
  - package-ecosystem: 'nuget'
    directory: '/Plugin'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Pinned per-target-framework to the Rhino 8 / Rhino 9 SDK line (net9
      # rides a `-wip` prerelease). Bumping it changes the minimum Rhino the
      # plugin loads in — a deliberate call, not a dependency chore.
      - dependency-name: 'Grasshopper'
