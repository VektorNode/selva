version: 2

# One grouped PR per ecosystem per week. Grouping is the point: a single PR
# means one CI run and one auto-merge (see dependabot-auto-merge.yml) instead of
# a dozen. Majors are split out so a breaking bump never rides along with
# routine patches — that workflow refuses to auto-merge them.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      npm:
        update-types: ['minor', 'patch']
      npm-major:
        update-types: ['major']
    ignore:
      # TS 7 breaks the toolchain, not our source: svelte-check/svelte2tsx peer
      # on ^6, and tsup's dts step dies at require time on the restructured
      # compiler host. Grouped majors meant this one bump failed the whole PR.
      # Drop this once those ship TS 7 support; catalog pin is the other half.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # '/' only covers .github/workflows/. Composite actions live outside that
  # scope and silently lag behind (pnpm/setup-node sat at v4 while every
  # workflow moved to v6/v7) unless their directory is listed explicitly.
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/.github/actions/setup'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      actions:
        update-types: ['minor', 'patch']
      actions-major:
        update-types: ['major']

  # '/Plugin' covers every *.csproj beneath it: Selva.GH, Selva.Rhino,
  # Selva.Schema, Selva.Drawing and their test projects. Versions themselves
  # live in Plugin/Directory.Packages.props — one declaration per package, so a
  # bump can no longer land in one project and leave its consumers behind.
  - package-ecosystem: 'nuget'
    directory: '/Plugin'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      nuget:
        patterns: ['*']
    ignore:
      # Pinned per-target-framework to the Rhino 8 / Rhino 9 SDK line (net9
      # rides a `-wip` prerelease). Bumping it changes the minimum Rhino the
      # plugin loads in — a deliberate call, not a dependency chore.
      - dependency-name: 'Grasshopper'
      # Held at 8.0.0 by net7.0 (Rhino 8): 10.x duplicates types that are
      # already in the framework's System.Drawing.Primitives, so every
      # ColorTranslator use fails to compile with CS0433. Bumping it is gated on
      # dropping net7.0, not on a version being available.
      - dependency-name: 'System.Drawing.Common'
