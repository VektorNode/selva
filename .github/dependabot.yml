version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    allow:
      - dependency-type: 'all'
    open-pull-requests-limit: 10
    reviewers:
      - 'VektorNode/maintainers'
    commit-message-prefix: 'chore(deps):'
    commit-message-prefix-scope: 'npm'
    rebase-strategy: 'auto'
    # Group dependencies by type for smart merging
    groups:
      security-patches:
        dependency-type: 'all'
        update-types:
          - 'patch'
        patterns:
          - '*security*'
      production-minor:
        dependency-type: 'production'
        update-types:
          - 'minor'
      development:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      major-updates:
        dependency-type: 'all'
        update-types:
          - 'major'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
    open-pull-requests-limit: 5
    commit-message-prefix: 'ci(actions):'
    rebase-strategy: 'auto'
