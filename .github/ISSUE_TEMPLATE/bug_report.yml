name: Bug Report
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check the [documentation](https://github.com/VektorNode/selva/blob/main/CLAUDE.md) first to ensure this is not expected behavior. Note: Rhino 7 is not supported.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug you encountered
      placeholder: A clear and concise description of what the bug is
    validations:
      required: true

  - type: checkboxes
    id: affected-areas
    attributes:
      label: Affected Components
      options:
        - label: Plugin UI (@selvajs/plugin-ui)
        - label: Cloud App (@selvajs/selva)
        - label: Grasshopper Plugin (C#)
        - label: Core / Compute
        - label: Other

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: What is your operating system, Node version, and Rhino version?
      placeholder: |
        OS: Windows 11
        Node: 20.6.0
        Rhino: 8.4
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Grasshopper
        2. Add UIBuilderComponent
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Logs
      description: Include any error messages, browser console output, or Grasshopper component messages
      render: shell
