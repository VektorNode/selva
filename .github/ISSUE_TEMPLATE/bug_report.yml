name: Bug Report
description: Report a bug or unexpected behavior
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check the [documentation](https://github.com/anthropics/selva/blob/master/CLAUDE.md) first to ensure this is not expected behavior.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug you encountered
      placeholder: A clear and concise description of what the bug is
    validations:
      required: true

  - type: checkboxes
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - label: Low (minor inconvenience, does not affect functionality)
        - label: Medium (affects functionality but has a workaround)
        - label: High (major functionality is broken, no workaround)
        - label: Critical (application crashes or data loss)
    validations:
      required: true

  - type: checkboxes
    id: affected-areas
    attributes:
      label: Affected Components
      description: Which parts of Selva are affected?
      options:
        - label: Frontend (Web UI - @selva/frontend)
        - label: Plugin (C# Grasshopper component)
        - label: Schema (JSON Schema / Type definitions)
        - label: Svelte UI (@selva/svelte-ui)
        - label: Communication (WebSocket/HTTP)
        - label: Build System
        - label: Documentation

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: What is your operating system and browser?
      placeholder: |
        OS: Windows 11
        Browser: Chrome 131.0
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open Grasshopper
        2. Add UIBuilderComponent
        3. Set Enable = true
        4. Notice that...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Selva Version
      description: What version of Selva are you using?
      placeholder: e.g., 1.0.0 or commit hash
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Messages / Logs
      description: Include any error messages, browser console output, or Grasshopper component messages
      render: shell
    validations:
      required: false
