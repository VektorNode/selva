packages:
  - packages/*
  - packages/providers/*

catalogs:
  default:
    '@floating-ui/dom': ^1.8.0
    '@iconify/svelte': ^5.2.1
    '@lucide/svelte': ^1.30.0
    '@playwright/test': ^1.62.1
    '@sveltejs/adapter-auto': ^7.0.1
    '@sveltejs/kit': 2.70.2
    '@sveltejs/vite-plugin-svelte': ^7.2.0
    '@tailwindcss/vite': ^4.3.3
    # Track the runtime (.nvmrc / engines.node), not the newest Node line —
    # types ahead of the runtime typecheck APIs the deployed Node doesn't have.
    '@types/node': ^24.13.3
    '@types/three': ^0.185.4
    bits-ui: ^2.18.0
    clsx: ^2.1.1
    eslint: ^10.8.0
    mode-watcher: ^1.1.0
    prettier: ^3.9.6
    rimraf: ^6.1.3
    sharp: ^0.35.3
    svelte: 5.56.8
    svelte-check: ^4.7.5
    svelte-sonner: ^1.1.1
    tailwind-merge: ^3.5.0
    tailwind-variants: ^3.3.1
    tailwindcss: ^4.3.3
    three: ^0.185.1
    tsdown: ^0.22.14
    tw-animate-css: ^1.4.0
    # Held at 6.x: svelte-check and svelte2tsx both cap their `typescript` peer
    # at ^6. Tilde so a caret can't walk into the next major on its own — see
    # the matching ignore in .github/dependabot.yml.
    typescript: ~6.0.3
    vite: ^8.2.1
    vitest: ^4.1.10
    ws: ^8.21.3
    '@types/ws': ^8.5.13
    zod: ^4.3.6

# Transitive CVE bumps. Ranged so each one stops applying once the parent
# upgrades on its own — drop an entry when nothing resolves below its bound.
overrides:
  cookie@<0.7.0: ^0.7.2
  brace-expansion@>=3.0.0 <5.0.8: ^5.0.8
  nanoid@<3.3.17: ^3.3.17
  # Reached only through rehype-mermaid in the website docs build (private
  # package, diagrams authored in-repo). Both sit inside their parents'
  # declared ranges, so this picks a version mermaid already accepts.
  mermaid@<11.16.1: ^11.16.1
  dompurify@<3.4.13: ^3.4.13
  # pm2 pins js-yaml to an exact 4.3.0, so this deliberately overrules that
  # pin. Patch-level bump on the same major; revisit if pm2 ever pins for a
  # reason of its own.
  js-yaml@4.3.0: 4.3.1

peerDependencyRules:
  allowedVersions:
    '@sveltejs/kit': 2.70.2

preferWorkspacePackages: true

shared-workspace-lockfile: true

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  supabase: true
  protobufjs: false
  # firebase-tools' optional native regex engine. Unbuilt it falls back to
  # JS RegExp, which is all the hosting deploy path uses.
  re2: false
