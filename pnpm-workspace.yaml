packages:
  - packages/*
  - packages/providers/*

catalogs:
  default:
    '@axe-core/playwright': 4.14.0
    '@electric-sql/pglite': 0.5.14
    '@fontsource-variable/hanken-grotesk': ^5.3.0
    '@floating-ui/dom': ^1.8.0
    '@iconify/svelte': ^5.2.4
    '@lucide/svelte': ^1.66.0
    '@playwright/test': ^1.64.1
    '@supabase/supabase-js': ^2.118.0
    '@sveltejs/adapter-auto': ^8.0.0
    '@sveltejs/adapter-node': ^6.0.1
    '@sveltejs/adapter-static': ^4.0.1
    '@sveltejs/kit': 3.1.1
    '@sveltejs/package': ^3.0.2
    '@sveltejs/vite-plugin-svelte': ^7.3.1
    '@tailwindcss/vite': ^4.3.3
    # Track the runtime (.nvmrc / engines.node), not the newest Node line —
    # types ahead of the runtime typecheck APIs the deployed Node doesn't have.
    '@types/node': ^26.6.6
    '@types/nodemailer': ^8.0.2
    '@types/three': ^0.187.0
    bits-ui: ^2.20.2
    clsx: ^2.1.1
    eslint: ^10.14.0
    fast-check: ^4.10.2
    fflate: ^0.8.2
    lucide: ^1.66.0
    mode-watcher: ^1.1.0
    nodemailer: ^10.3.1
    prettier: ^3.9.10
    rhino3dm: 8.35.0
    rimraf: ^6.1.3
    sharp: ^0.35.5
    svelte: 5.57.3
    svelte-check: ^4.7.7
    svelte-sonner: ^1.2.2
    tailwind-merge: ^3.7.0
    tailwind-variants: ^4.0.1
    tailwindcss: ^4.3.3
    three: ^0.187.0
    three-mesh-bvh: ^0.9.16
    typedoc: ^0.28.17
    undici: ^8.12.2
    tsdown: ^0.23.4
    tw-animate-css: ^1.4.0
    # Held at 6.x: svelte-check and svelte2tsx both cap their `typescript` peer
    # at ^6. Tilde so a caret can't walk into the next major on its own — see
    # the matching ignore in .github/dependabot.yml.
    typescript: ~6.0.3
    vite: ^8.3.5
    vitest: ^5.0.5
    ws: ^8.22.1
    '@types/ws': ^8.18.2
    zod: ^4.6.7

# Transitive CVE bumps. Ranged so each one stops applying once the parent
# upgrades on its own — drop an entry when nothing resolves below its bound.
overrides:
  cookie@<0.7.0: ^0.7.2
  brace-expansion@>=3.0.0 <5.0.12: ^5.0.12
  nanoid@<3.3.17: ^3.3.17
  # Reached only through rehype-mermaid in the website docs build (private
  # package, diagrams authored in-repo). Both sit inside their parents'
  # declared ranges, so this picks a version mermaid already accepts.
  mermaid@<11.16.1: ^11.16.1
  dompurify@<3.4.13: ^3.4.13
  # minimatch: patch within each major, never across. 3–6 export the matcher
  # as the module itself, 10+ export { minimatch }: firebase-tools and
  # superstatic call require('minimatch')() and throw on 10+. 10 → 11 is the
  # one safe jump (same exports) and the only fix for GHSA-g3hv-75wg-m249,
  # which reaches the --prod audit through eslint (@selvajs/config). The old
  # majors keep that moderate advisory; they are dev-only (firebase deploy).
  minimatch@<3.1.4: ^3.1.4
  minimatch@>=5.0.0 <5.1.8: ^5.1.8
  minimatch@>=6.0.0 <6.2.2: ^6.2.2
  minimatch@>=10.0.0 <11.0.1: ^11.0.1
  # 11.x removed matchOne, which TypeDoc calls. Docs-build only. Drop once a
  # TypeDoc release accepts minimatch 11.
  typedoc>minimatch: ^10.2.5
  glob@>=9.0.0 <14.0.2: ^14.0.2
  devalue@<5.9.3: ^5.9.4
  # js-yaml 4.x below 4.3.2 has the merge-key CPU advisories. Same major as every
  # parent's range (json-schema-ref-parser ^4.1.0; pm2 7.1.2 pins 4.3.2 itself).
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2

peerDependencyRules:
  allowedVersions:
    '@sveltejs/kit': 3.1.1

preferWorkspacePackages: true

shared-workspace-lockfile: true

allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  supabase: true
  protobufjs: false
  # firebase-tools' optional native regex engine. Unbuilt it falls back to
  # JS RegExp, which is all the hosting deploy path uses.
  re2: false
