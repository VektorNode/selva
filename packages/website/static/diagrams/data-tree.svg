<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, sans-serif">
  <title id="t">A Grasshopper data tree</title>
  <desc id="d">A tree with two floors. Floor 0 has panel {0;0} with four items and panel {0;1} with three. Floor 1 has panel {1;0} with two items. The path {1;0} is highlighted: floor 1, then panel 0.</desc>
  <rect width="700" height="290" rx="12" fill="#16201a"/>

  <g fill="#9aa79c" font-size="13" font-weight="600" letter-spacing=".05em" text-anchor="middle">
    <text x="70" y="34">TREE</text>
    <text x="225" y="34">FLOOR</text>
    <text x="385" y="34">PANEL</text>
    <text x="545" y="34">ITEMS</text>
  </g>

  <g fill="none" stroke="#6f8073" stroke-width="2" stroke-linejoin="round">
    <path d="M110 150 H145 V85 H180"/>
    <path d="M270 85 H305 V58 H340"/>
    <path d="M270 85 H305 V112 H340"/>
    <path d="M430 58 H488"/>
    <path d="M430 112 H488"/>
  </g>
  <g fill="none" stroke="#7cc47f" stroke-width="3" stroke-linejoin="round">
    <path d="M110 150 H145 V220 H180"/>
    <path d="M270 220 H340"/>
    <path d="M430 220 H488"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">
    <rect x="30" y="133" width="80" height="34" rx="8" fill="#1e2a22" stroke="#6f8073" stroke-width="2"/>
    <text x="70" y="156" fill="#e8ebe3" font-family="ui-sans-serif, system-ui, sans-serif">Tree</text>

    <rect x="180" y="68" width="90" height="34" rx="8" fill="#16201a" stroke="#6f8073" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="225" y="91" fill="#9aa79c">{0}</text>
    <rect x="180" y="203" width="90" height="34" rx="8" fill="#1e2a22" stroke="#7cc47f" stroke-width="3"/>
    <text x="225" y="226" fill="#e8ebe3">{1}</text>

    <rect x="340" y="41" width="90" height="34" rx="8" fill="#1e2a22" stroke="#6f8073" stroke-width="2"/>
    <text x="385" y="64" fill="#e8ebe3">{0;0}</text>
    <rect x="340" y="95" width="90" height="34" rx="8" fill="#1e2a22" stroke="#6f8073" stroke-width="2"/>
    <text x="385" y="118" fill="#e8ebe3">{0;1}</text>
    <rect x="340" y="203" width="90" height="34" rx="8" fill="#1e2a22" stroke="#7cc47f" stroke-width="3"/>
    <text x="385" y="226" fill="#e8ebe3">{1;0}</text>
  </g>

  <g fill="#6f8073">
    <circle cx="500" cy="58" r="9"/><circle cx="530" cy="58" r="9"/><circle cx="560" cy="58" r="9"/><circle cx="590" cy="58" r="9"/>
    <circle cx="500" cy="112" r="9"/><circle cx="530" cy="112" r="9"/><circle cx="560" cy="112" r="9"/>
  </g>
  <g fill="#7cc47f"><circle cx="500" cy="220" r="9"/><circle cx="530" cy="220" r="9"/></g>

  <text x="350" y="272" fill="#e8ebe3" font-size="15" text-anchor="middle"><tspan fill="#7cc47f" font-family="ui-monospace, monospace">{1;0}</tspan> = floor 1, panel 0</text>
</svg>
