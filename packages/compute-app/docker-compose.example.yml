# Docker Compose configuration for Selva Compute App with Caddy reverse proxy
#
# Usage:
# 1. Copy this file as docker-compose.yml
# 2. Update environment variables (COMPUTE_SERVER_URL, ORIGIN, etc.)
# 3. Run: docker-compose up -d

version: '3.8'

services:
  # Caddy reverse proxy with automatic HTTPS
  caddy:
    image: caddy:latest
    container_name: caddy-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app-network
    restart: unless-stopped

  # First compute app instance
  web-1:
    image: selva-compute-app:latest
    container_name: selva-compute-app-1
    environment:
      - PORT=3000
      - ORIGIN=https://your-domain.com
      - COMPUTE_SERVER_URL=http://your-compute-server:8080
      - GH_DEFINITIONS_PATH=./definitions
      - COMPUTE_API_KEY=${COMPUTE_API_KEY}
    volumes:
      - ./definitions:/app/definitions
    networks:
      - app-network
    restart: unless-stopped
    expose:
      - 3000

  # Second compute app instance (optional - remove if not needed)
  web-2:
    image: selva-compute-app:latest
    container_name: selva-compute-app-2
    environment:
      - PORT=3000
      - ORIGIN=https://your-domain.com
      - COMPUTE_SERVER_URL=http://your-compute-server:8080
      - GH_DEFINITIONS_PATH=./definitions
      - COMPUTE_API_KEY=${COMPUTE_API_KEY}
    volumes:
      - ./definitions:/app/definitions
    networks:
      - app-network
    restart: unless-stopped
    expose:
      - 3000

  # Third compute app instance (optional - remove if not needed)
  web-3:
    image: selva-compute-app:latest
    container_name: selva-compute-app-3
    environment:
      - PORT=3000
      - ORIGIN=https://your-domain.com
      - COMPUTE_SERVER_URL=http://your-compute-server:8080
      - GH_DEFINITIONS_PATH=./definitions
      - COMPUTE_API_KEY=${COMPUTE_API_KEY}
    volumes:
      - ./definitions:/app/definitions
    networks:
      - app-network
    restart: unless-stopped
    expose:
      - 3000

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
