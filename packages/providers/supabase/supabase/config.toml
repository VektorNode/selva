# Supabase local stack for @selvajs/supabase-provider.
# Run from the package root: `npx supabase start` (Docker Desktop required).
# The output prints SUPABASE_URL, SUPABASE_ANON_KEY, and SUPABASE_SERVICE_ROLE_KEY
# — copy those into `.env.test` for the conformance tests.

project_id = "selva-supabase-provider"

[api]
enabled = true
port = 54421
# Exposed REST schemas. `selva` (where all Selva tables live, isolated from a
# consuming app's `public`) is intentionally NOT listed here: PostgREST loads
# this config at stack boot, *before* migrations run, so naming a not-yet-created
# schema fails the health check and aborts `supabase start`. Instead the initial
# migration exposes `selva` via `alter role authenticator set pgrst.db_schemas`
# once the schema exists. A hosted project that boots from a snapshot already
# containing `selva` may also add it here directly.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54423

[inbucket]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:54421"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental]
