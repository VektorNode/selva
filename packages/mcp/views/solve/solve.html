<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Solve in 3D</title>
		<style>
			:root {
				color-scheme: light dark;
				--fg: var(--color-text-primary, #1f2328);
				--muted: var(--color-text-secondary, #656d76);
				--bg: var(--color-background-primary, #ffffff);
				--line: var(--color-border-primary, #d0d7de);
				--accent: var(--color-text-info, #0969da);
				--on-accent: var(--color-background-primary, #ffffff);
				--panel: var(--color-background-secondary, #f6f8fa);
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme='light']) {
					--fg: var(--color-text-primary, #e6edf3);
					--muted: var(--color-text-secondary, #8d96a0);
					--bg: var(--color-background-primary, #0d1117);
					--line: var(--color-border-primary, #30363d);
					--accent: var(--color-text-info, #4493f8);
					--on-accent: var(--color-background-primary, #0d1117);
					--panel: var(--color-background-secondary, #161b22);
				}
			}
			:root[data-theme='dark'] {
				--fg: var(--color-text-primary, #e6edf3);
				--muted: var(--color-text-secondary, #8d96a0);
				--bg: var(--color-background-primary, #0d1117);
				--line: var(--color-border-primary, #30363d);
				--accent: var(--color-text-info, #4493f8);
				--on-accent: var(--color-background-primary, #0d1117);
				--panel: var(--color-background-secondary, #161b22);
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				background: var(--bg);
				color: var(--fg);
				font: 14px/1.4 var(--font-sans, system-ui, sans-serif);
			}
			header {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 8px 12px;
				border-bottom: 1px solid var(--line);
			}
			h1 {
				flex: 1;
				margin: 0;
				font-size: 14px;
				font-weight: 600;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			button,
			header select {
				font: inherit;
				font-size: 13px;
				color: inherit;
				background: transparent;
				border: 1px solid var(--line);
				border-radius: 6px;
				height: 28px;
				padding: 0 10px;
				cursor: pointer;
			}
			button:hover:not(:disabled),
			header select:hover {
				background: var(--panel);
			}
			button:disabled {
				cursor: default;
				opacity: 0.6;
			}
			[hidden] {
				display: none !important;
			}
			main {
				display: flex;
				height: 420px;
			}
			body.fullscreen {
				display: flex;
				flex-direction: column;
				height: 100vh;
			}
			body.fullscreen main {
				flex: 1;
				height: auto;
				min-height: 0;
			}
			#stage {
				position: relative;
				flex: 1;
				min-width: 0;
			}
			#form {
				width: 260px;
				flex: none;
				overflow-y: auto;
				padding: 12px 12px 0;
				border-right: 1px solid var(--line);
				display: flex;
				flex-direction: column;
				gap: 12px;
			}
			@media (max-width: 560px) {
				main {
					flex-direction: column;
					height: auto;
				}
				#stage {
					height: 320px;
				}
				#form {
					width: auto;
					border-right: 0;
					border-bottom: 1px solid var(--line);
				}
			}
			.field {
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.field.inline {
				flex-direction: row-reverse;
				justify-content: flex-end;
				align-items: center;
				gap: 8px;
			}
			.field .name {
				color: var(--muted);
				font-size: 12px;
			}
			.field input:not([type='checkbox']),
			.field select {
				font: inherit;
				color: inherit;
				background: var(--bg);
				border: 1px solid var(--line);
				border-radius: 6px;
				height: 32px;
				padding: 0 8px;
				min-width: 0;
			}
			.field input:focus-visible,
			.field select:focus-visible,
			button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 1px;
			}
			.field input[type='checkbox'] {
				width: 16px;
				height: 16px;
				margin: 0;
				accent-color: var(--accent);
			}
			.field.inline .name {
				color: var(--fg);
				font-size: 14px;
			}
			/* Stays in reach at the bottom of a long form. */
			button.solve {
				position: sticky;
				bottom: 0;
				margin-top: auto;
				flex: none;
				height: 34px;
				font-weight: 600;
				color: var(--on-accent);
				background: var(--accent);
				border-color: var(--accent);
				box-shadow: 0 -12px 0 var(--bg);
				margin-bottom: 12px;
			}
			button.solve:hover:not(:disabled) {
				background: var(--accent);
				filter: brightness(1.1);
			}
			#status {
				position: absolute;
				inset: 0;
				display: grid;
				place-items: center;
				padding: 16px;
				text-align: center;
				pointer-events: none;
			}
			#status span {
				max-width: 80%;
				padding: 6px 12px;
				border-radius: 6px;
				color: var(--fg);
				background: color-mix(in srgb, var(--bg) 85%, transparent);
				box-shadow: 0 1px 4px rgb(0 0 0 / 0.15);
			}
		</style>
	</head>
	<body>
		<header>
			<h1 id="title">Solve in 3D</h1>
			<button id="inputs" type="button" aria-controls="form" hidden>Hide inputs</button>
			<select id="look" aria-label="Look" hidden></select>
			<button id="fit" type="button" hidden>Fit</button>
			<button id="fullscreen" type="button" hidden>Fullscreen</button>
		</header>
		<main>
			<div id="form" hidden></div>
			<div id="stage">
				<div id="status"><span>Waiting for the solve…</span></div>
			</div>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
