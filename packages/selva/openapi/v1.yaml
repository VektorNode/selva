openapi: "3.1.0"
info:
  title: Selva API
  version: "1.0.0"
  description: "The tenant-scoped Selva API. Every endpoint acts as the calling identity and is confined to that identity's organization.\n\n**Stability.** Public endpoints are additive-only within v1: new optional fields and parameters may appear, but nothing is removed, renamed, or changed in type or meaning. A breaking change ships as a new route under `/api/v2` alongside this one. Anything deprecated inside v1 keeps working for a stated window and returns a `Deprecation` header while it does.\n\n**Operations marked `x-internal` carry none of that promise.** They exist to serve the Selva web UI and may change or disappear without notice.\n\n**Existence is never disclosed.** A resource the caller may not see returns `404`, not `403`. `403` means the resource is visible but the action is not allowed.\n\n**No CORS.** `/api/v1` sends no cross-origin headers; it serves same-origin browser requests and non-browser clients holding a token.\n\nInstance administration lives at `/api/admin`, is session-only, is never reachable with a bearer token, and is not described here."
  license:
    name: MIT
servers:
  - url: /
    description: The Selva instance serving this document.
security:
  - cookieAuth: []
  - bearerAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie. Same-origin only.
    bearerAuth:
      type: http
      scheme: bearer
      description: "A personal access token. `/api/v1` is the only prefix that accepts one — `/api/admin` never does."
  parameters:
    limit:
      name: limit
      in: query
      required: false
      description: "Page size. Out-of-range values clamp rather than fail, so a client walking a cursor is never stopped by pagination plumbing. Default 50."
      schema:
        type: integer
        minimum: 1
        maximum: 200
    cursor:
      name: cursor
      in: query
      required: false
      description: "An opaque cursor from a previous response's `nextCursor`. Do not construct or parse one."
      schema:
        type: string
    orderBy:
      name: orderBy
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - updatedAt
          - name
    orderDir:
      name: orderDir
      in: query
      required: false
      schema:
        type: string
        enum:
          - asc
          - desc
  schemas:
    Page:
      type: object
      description: "The envelope every collection returns. `nextCursor` is absent on the last page."
      properties:
        items:
          type: array
          items:
            type: object
        nextCursor:
          type: string
      required:
        - items
    Error:
      type: object
      description: "Every failure carries this shape. Branch on `code`, not on the human-readable `message`."
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - UNPROCESSABLE
            - COMPUTE_UNAVAILABLE
            - SETUP_REQUIRED
            - INTERNAL
        fields:
          type: object
          description: "Per-field messages, keyed by dotted path. Present on validation failures."
          additionalProperties:
            type: string
      required:
        - message
        - code
